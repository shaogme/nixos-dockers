# Base configuration for the application
x-app-base: &app-base
  image: ghcr.io/shaogme/coding-images/npins-common:latest
  environment:
    - DEVBOX_AUTO_INIT=${DEVBOX_AUTO_INIT:-0} # Auto-initialize devbox.json if not present
    - HOST_UID # Set HOST_UID=host_uid[:host_gid] explicitly; otherwise infer the mounted workspace owner
    - CONTAINER_HOME=${CONTAINER_HOME:-/home/user} # Unified container home path for root and non-root users
  security_opt:
    - seccomp:unconfined # Required for some low-level operations
  cap_add:
    - SYS_ADMIN
    - NET_ADMIN
    - SYS_PTRACE
  tty: true

services:
  # Develop mode: Mounts local directory for hot-reloading (Default)
  dev:
    <<: *app-base
    container_name: nixos-dockers-dev
    volumes:
      # Mount host source code
      - .:/workspace
      - /workspace/.git
      # Persist devbox data
      - devbox-data:/data/devbox
      # Persist unified AI credentials and tool configurations
      - coding-config:/data/coding-config

volumes:
  devbox-data:
  coding-config:
