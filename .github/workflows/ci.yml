name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  workspace-test:
    name: workspace / rootful-docker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@main

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-trusted-public-keys = mise-cache-1:wc5EMEDHcUyzRUTm6EuRKp0hhsJiKB2lfEi3ZOT1ahg=

      - name: Install QEMU and SSH host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-client qemu-system-x86 qemu-utils

      - name: Run workspace suite in rootful Docker guest
        env:
          QEMU_TEST_ARTIFACTS: ${{ runner.temp }}/qemu-artifacts
        run: bash scripts/qemu-test.sh workspace

      - name: Upload workspace guest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-workspace-rootful-docker
          path: ${{ runner.temp }}/qemu-artifacts
          if-no-files-found: warn
          retention-days: 7

  docker-test:
    name: ${{ matrix.target }} / ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: crates
            runtime: rootful-docker
          - target: crates
            runtime: rootless-podman
          - target: mise
            runtime: rootful-docker
          - target: npins
            runtime: rootful-docker
          - target: rust
            runtime: rootful-docker
          - target: podman
            runtime: rootful-docker
          - target: podman
            runtime: rootless-podman
    steps:
      - name: Check out repository
        uses: actions/checkout@main

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-trusted-public-keys = mise-cache-1:wc5EMEDHcUyzRUTm6EuRKp0hhsJiKB2lfEi3ZOT1ahg=

      - name: Setup NixCache for mise
        if: matrix.target == 'mise'
        uses: shaogme/nixcache-oci/setup@main
        with:
          repo: shaogme/mise-nixcache
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install QEMU and SSH host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-client qemu-system-x86 qemu-utils

      - name: Run ${{ matrix.target }} suite in ${{ matrix.runtime }} guest
        env:
          QEMU_TEST_ARTIFACTS: ${{ runner.temp }}/qemu-artifacts
          QEMU_TEST_NIXCACHE_PROXY_PORT: ${{ matrix.target == 'mise' && '37515' || '' }}
          QEMU_TEST_NIXCACHE_PUBLIC_KEY: ${{ matrix.target == 'mise' && 'mise-cache-1:wc5EMEDHcUyzRUTm6EuRKp0hhsJiKB2lfEi3ZOT1ahg=' || '' }}
        run: bash scripts/qemu-test.sh "${{ matrix.target }}" --runtime "${{ matrix.runtime }}"

      - name: Upload ${{ matrix.target }} ${{ matrix.runtime }} logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.target }}-${{ matrix.runtime }}
          path: ${{ runner.temp }}/qemu-artifacts
          if-no-files-found: warn
          retention-days: 7

  reaper-vm-test:
    name: container-init-reaper / nixosTest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@main

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install QEMU and SSH host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-client qemu-system-x86 qemu-utils

      - name: Build and run the independent nixosTest driver
        env:
          QEMU_TEST_ARTIFACTS: ${{ runner.temp }}/qemu-artifacts
        run: bash scripts/qemu-test.sh nixos-reaper

      - name: Upload NixOS test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nixos-container-init-reaper-vm
          path: ${{ runner.temp }}/qemu-artifacts
          if-no-files-found: warn
          retention-days: 7

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [workspace-test, docker-test, reaper-vm-test]
    if: always()
    steps:
      - name: Check all test results
        env:
          WORKSPACE_RESULT: ${{ needs.workspace-test.result }}
          DOCKER_RESULT: ${{ needs.docker-test.result }}
          REAPER_RESULT: ${{ needs.reaper-vm-test.result }}
        run: |
          if [[ "$WORKSPACE_RESULT" == success && "$DOCKER_RESULT" == success && "$REAPER_RESULT" == success ]]; then
            echo "Workspace, all target/runtime combinations, and NixOS VM tests passed."
          else
            echo "Workspace: $WORKSPACE_RESULT"
            echo "Docker matrix: $DOCKER_RESULT"
            echo "NixOS reaper VM: $REAPER_RESULT"
            exit 1
          fi
