name: Docker Publish

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/image.nix"
      - "**/deps.nix"
      - "**/*.nix"
      - "**/sources.json"
      - "container-init/**"
      - "dev-env/**"
      - "tests/**"
      - ".github/workflows/docker-publish.yml"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      runtime_matrix: ${{ steps.set-matrix.outputs.runtime_matrix }}
      builder_matrix: ${{ steps.set-matrix.outputs.builder_matrix }}
    steps:
      - uses: actions/checkout@main
      - id: set-matrix
        run: |
          # Every image definition publishes CLI, vscode, and builder roles.
          IMAGE_NAMES=$(find images -maxdepth 2 -name "image.nix" | sort | jq -R . | jq -s -c '
            map(capture("images/(?<name>[^/]+)/image.nix"))
          ')
          RUNTIME_MATRIX=$(echo "$IMAGE_NAMES" | jq -c '
            map(
              . as $image |
              [
                { file: "images/\($image.name)/image.nix", attr: $image.name, name: $image.name },
                { file: "images/\($image.name)/image.nix", attr: "vscode-\($image.name)", name: "vscode-\($image.name)" }
              ]
            ) | flatten
          ')
          BUILDER_MATRIX=$(echo "$IMAGE_NAMES" | jq -c '
            map(
              . as $image |
              [{
                file: "images/\($image.name)/image.nix",
                attr: "\($image.name)-builder",
                name: "\($image.name)-builder"
              }]
            ) | flatten
          ')
          echo "runtime_matrix=$RUNTIME_MATRIX" >> $GITHUB_OUTPUT
          echo "builder_matrix=$BUILDER_MATRIX" >> $GITHUB_OUTPUT

  build-and-publish-builders:
    needs: discover
    if: ${{ needs.discover.outputs.builder_matrix != '[]' && needs.discover.outputs.builder_matrix != '' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.builder_matrix) }}
    uses: ./.github/workflows/build-image.yml
    with:
      file: ${{ matrix.target.file }}
      attr: ${{ matrix.target.attr }}
      name: ${{ matrix.target.name }}
    secrets: inherit

  build-and-publish-runtimes:
    needs: [discover, build-and-publish-builders]
    if: ${{ needs.discover.outputs.runtime_matrix != '[]' && needs.discover.outputs.runtime_matrix != '' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.runtime_matrix) }}
    uses: ./.github/workflows/build-image.yml
    with:
      file: ${{ matrix.target.file }}
      attr: ${{ matrix.target.attr }}
      name: ${{ matrix.target.name }}
    secrets: inherit
