name: Docker Publish

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/image.nix"
      - "**/deps.nix"
      - "**/*.nix"
      - "**/sources.json"
      - "container-init/**"
      - "dev-env/**"
      - "tests/**"
      - ".github/workflows/docker-publish.yml"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      runtime_matrix: ${{ steps.set-matrix.outputs.runtime_matrix }}
      builder_matrix: ${{ steps.set-matrix.outputs.builder_matrix }}
      engine_matrix: ${{ steps.set-matrix.outputs.engine_matrix }}
    steps:
      - uses: actions/checkout@main
      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - id: set-matrix
        run: |
          RUNTIME_MATRIX='[]'
          BUILDER_MATRIX='[]'
          ENGINE_MATRIX='[]'
          while IFS= read -r file; do
            name="${file#images/}"
            name="${name%/image.nix}"
            role=$(nix-instantiate --eval --raw "$file" -A role 2>/dev/null || printf runtime)
            outputs=$(nix-instantiate --eval --json "$file" -A outputs 2>/dev/null || printf '["%s"]' "$name")
            if [[ "$role" == engine ]]; then
              ENGINE_MATRIX=$(jq -c --arg file "$file" --arg role "$role" --argjson outputs "$outputs" \
                '. + ($outputs | map({file: $file, role: $role, attr: ., name: .}))' <<< "$ENGINE_MATRIX")
            else
              RUNTIME_MATRIX=$(jq -c --arg file "$file" --arg role "$role" --argjson outputs "$outputs" \
                '. + ($outputs | map({file: $file, role: $role, attr: ., name: .}) + map({file: $file, role: $role, attr: ("vscode-" + .), name: ("vscode-" + .)}))' <<< "$RUNTIME_MATRIX")
              BUILDER_MATRIX=$(jq -c --arg file "$file" --arg role "$role" --argjson outputs "$outputs" \
                '. + ($outputs | map({file: $file, role: $role, attr: (. + "-builder"), name: (. + "-builder")}))' <<< "$BUILDER_MATRIX")
            fi
          done < <(find images -maxdepth 2 -name "image.nix" | sort)
          echo "runtime_matrix=$RUNTIME_MATRIX" >> $GITHUB_OUTPUT
          echo "builder_matrix=$BUILDER_MATRIX" >> $GITHUB_OUTPUT
          echo "engine_matrix=$ENGINE_MATRIX" >> $GITHUB_OUTPUT

  build-and-publish-engines:
    needs: discover
    if: ${{ needs.discover.outputs.engine_matrix != '[]' && needs.discover.outputs.engine_matrix != '' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.engine_matrix) }}
    uses: ./.github/workflows/build-image.yml
    with:
      file: ${{ matrix.target.file }}
      attr: ${{ matrix.target.attr }}
      name: ${{ matrix.target.name }}
      role: ${{ matrix.target.role }}
    secrets: inherit

  build-and-publish-builders:
    needs: discover
    if: ${{ needs.discover.outputs.builder_matrix != '[]' && needs.discover.outputs.builder_matrix != '' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.builder_matrix) }}
    uses: ./.github/workflows/build-image.yml
    with:
      file: ${{ matrix.target.file }}
      attr: ${{ matrix.target.attr }}
      name: ${{ matrix.target.name }}
      role: ${{ matrix.target.role }}
    secrets: inherit

  build-and-publish-runtimes:
    needs: [discover, build-and-publish-builders]
    if: ${{ needs.discover.outputs.runtime_matrix != '[]' && needs.discover.outputs.runtime_matrix != '' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.runtime_matrix) }}
    uses: ./.github/workflows/build-image.yml
    with:
      file: ${{ matrix.target.file }}
      attr: ${{ matrix.target.attr }}
      name: ${{ matrix.target.name }}
      role: ${{ matrix.target.role }}
    secrets: inherit
