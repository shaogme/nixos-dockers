name: Docker Publish

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/image.nix"
      - "**/deps.nix"
      - "**/*.nix"
      - "**/sources.json"
      - ".github/workflows/docker-publish.yml"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@main
      - id: set-matrix
        run: |
          # Find directories containing image.nix under images/, format as matrix items with CLI and vscode variants
          MATRIX=$(find images -maxdepth 2 -name "image.nix" | sort | jq -R . | jq -s -c '
            map(
              capture("images/(?<name>[^/]+)/image.nix") |
              [
                { file: "images/\(.name)/image.nix", attr: .name, name: .name },
                { file: "images/\(.name)/image.nix", attr: "vscode-\(.name)", name: "vscode-\(.name)" }
              ]
            ) | flatten
          ')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-and-publish:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' && needs.discover.outputs.matrix != '' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/build-image.yml
    with:
      file: ${{ matrix.target.file }}
      attr: ${{ matrix.target.attr }}
      name: ${{ matrix.target.name }}
    secrets: inherit
