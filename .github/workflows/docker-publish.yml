name: Docker Publish

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/image.nix"
      - "**/deps.nix"
      - "**/*.nix"
      - "**/sources.json"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@main
      - id: set-matrix
        run: |
          # Find directories containing image.nix under images/, format as matrix items with CLI and vscode variants
          MATRIX=$(find images -maxdepth 2 -name "image.nix" | sort | jq -R . | jq -s -c '
            map(
              capture("images/(?<name>[^/]+)/image.nix") |
              [
                { file: "images/\(.name)/image.nix", attr: .name, name: .name },
                { file: "images/\(.name)/image.nix", attr: "vscode-\(.name)", name: "vscode-\(.name)" }
              ]
            ) | flatten
          ')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-and-push-arch:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' && needs.discover.outputs.matrix != '' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.matrix) }}
        arch:
          - name: amd64
            runner: ubuntu-latest
            system: x86_64-linux
          - name: arm64
            runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.arch.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Log in to the Container registry
        uses: docker/login-action@master
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build Docker image with Nix
        run: |
          # Build the target derivation attribute from image.nix for target architecture
          nix-build ${{ matrix.target.file }} \
            -A ${{ matrix.target.attr }} \
            --argstr system ${{ matrix.arch.system }}

      - name: Load and Push Arch Docker image
        run: |
          # Load the built image into docker
          docker load < result
          
          IMAGE_NAME="${{ matrix.target.name }}"
          # Prepare the GHCR image ID (lowercase repository and image name)
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=${{ env.REGISTRY }}/$REPO_LOWER/$IMAGE_LOWER
          
          # Extract component version from Nix metadata
          VERSION=$(nix-instantiate --eval --raw ${{ matrix.target.file }} \
            -A "${{ matrix.target.attr }}.imageVersion" \
            --argstr system ${{ matrix.arch.system }} 2>/dev/null || echo "latest")
          
          # Format date as YYYY.M.D (e.g., 2026.8.24)
          DATE=$(date +'%Y.%-m.%-d')
          VERSION_TAG="${VERSION}-${DATE}"
          ARCH="${{ matrix.arch.name }}"
          
          echo "Target Image: $IMAGE_ID"
          echo "Publishing arch tag: ${VERSION_TAG}-${ARCH}"
          
          # Tag architecture specific images
          docker tag $IMAGE_NAME:latest $IMAGE_ID:latest-${ARCH}
          docker tag $IMAGE_NAME:latest $IMAGE_ID:${VERSION_TAG}-${ARCH}
          
          # Push arch images to GHCR
          docker push $IMAGE_ID:latest-${ARCH}
          docker push $IMAGE_ID:${VERSION_TAG}-${ARCH}

  create-manifest:
    needs: [discover, build-and-push-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Log in to the Container registry
        uses: docker/login-action@master
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Create and Push Multi-Arch Manifest
        run: |
          IMAGE_NAME="${{ matrix.target.name }}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=${{ env.REGISTRY }}/$REPO_LOWER/$IMAGE_LOWER
          
          # Extract component version from Nix metadata
          VERSION=$(nix-instantiate --eval --raw ${{ matrix.target.file }} \
            -A "${{ matrix.target.attr }}.imageVersion" 2>/dev/null || echo "latest")
          DATE=$(date +'%Y.%-m.%-d')
          VERSION_TAG="${VERSION}-${DATE}"
          
          echo "Creating manifest for $IMAGE_ID:latest and $IMAGE_ID:$VERSION_TAG"
          
          # 1. Create and push latest multi-arch manifest
          docker manifest create $IMAGE_ID:latest \
            --amend $IMAGE_ID:latest-amd64 \
            --amend $IMAGE_ID:latest-arm64
          docker manifest push $IMAGE_ID:latest
          
          # 2. Create and push versioned multi-arch manifest
          docker manifest create $IMAGE_ID:${VERSION_TAG} \
            --amend $IMAGE_ID:${VERSION_TAG}-amd64 \
            --amend $IMAGE_ID:${VERSION_TAG}-arm64
          docker manifest push $IMAGE_ID:${VERSION_TAG}

