name: Docker Publish

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/image.nix"
      - "**/deps.nix"
      - "**/*.nix"
      - "**/sources.json"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@main
      - id: set-matrix
        run: |
          # Find directories containing image.nix under images/, format as JSON array
          DIRS=$(find images -maxdepth 2 -name "image.nix" -printf '%h\n' | sort -u | jq -R . | jq -s -c .)
          echo "matrix=$DIRS" >> $GITHUB_OUTPUT

  build-and-push:
    needs: discover
    runs-on: ubuntu-latest
    if: ${{ needs.discover.outputs.matrix != '[]' && needs.discover.outputs.matrix != '' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Log in to the Container registry
        uses: docker/login-action@master
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build Docker image with Nix
        run: |
          IMAGE_NAME=$(basename "${{ matrix.image }}")
          # Build the image, passing the image basename as imageName
          nix-build ${{ matrix.image }}/image.nix --argstr imageName "$IMAGE_NAME"

      - name: Load and Push Docker image
        run: |
          # Load the built image into docker
          docker load < result
          
          IMAGE_NAME=$(basename "${{ matrix.image }}")
          # Prepare the GHCR image ID (lowercase repository and image name)
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=${{ env.REGISTRY }}/$REPO_LOWER/$IMAGE_LOWER
          
          # Extract component version from Nix metadata
          VERSION=$(nix-instantiate --eval --raw ${{ matrix.image }}/image.nix -A imageVersion --argstr imageName "$IMAGE_NAME" 2>/dev/null || echo "latest")
          
          # Format date as YYYY.M.D (e.g., 2026.8.24)
          DATE=$(date +'%Y.%-m.%-d')
          VERSION_TAG="${VERSION}-${DATE}"
          
          echo "Target Image: $IMAGE_ID"
          echo "Publishing version tag: $VERSION_TAG"
          
          # Tag images
          docker tag $IMAGE_NAME:latest $IMAGE_ID:latest
          docker tag $IMAGE_NAME:latest $IMAGE_ID:${VERSION_TAG}
          
          # Push to GHCR (Docker registry protocol overwrites existing tags on push)
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:${VERSION_TAG}
