name: Build and Publish Image

on:
  workflow_call:
    inputs:
      file:
        required: true
        type: string
      attr:
        required: true
        type: string
      name:
        required: true
        type: string

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-trusted-public-keys = mise-cache-1:wc5EMEDHcUyzRUTm6EuRKp0hhsJiKB2lfEi3ZOT1ahg=

      - name: Setup NixCache for mise
        if: contains(inputs.name, 'mise')
        uses: shaogme/nixcache-oci/setup@main
        with:
          repo: shaogme/mise-nixcache
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AMD64 Docker image with Nix
        run: |
          nix-build ${{ inputs.file }} \
            -A ${{ inputs.attr }} \
            --argstr system x86_64-linux \
            -o result-amd64

      - name: Upload AMD64 image artifact
        uses: actions/upload-artifact@main
        with:
          name: image-${{ inputs.name }}-amd64
          path: result-amd64
          if-no-files-found: error

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-trusted-public-keys = mise-cache-1:wc5EMEDHcUyzRUTm6EuRKp0hhsJiKB2lfEi3ZOT1ahg=

      - name: Setup NixCache for mise
        if: contains(inputs.name, 'mise')
        uses: shaogme/nixcache-oci/setup@main
        with:
          repo: shaogme/mise-nixcache
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 Docker image with Nix
        run: |
          nix-build ${{ inputs.file }} \
            -A ${{ inputs.attr }} \
            --argstr system aarch64-linux \
            -o result-arm64

      - name: Upload ARM64 image artifact
        uses: actions/upload-artifact@main
        with:
          name: image-${{ inputs.name }}-arm64
          path: result-arm64
          if-no-files-found: error

  publish:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Log in to the Container registry
        uses: docker/login-action@master
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download AMD64 artifact
        uses: actions/download-artifact@main
        with:
          name: image-${{ inputs.name }}-amd64
          path: ./artifacts/amd64

      - name: Download ARM64 artifact
        uses: actions/download-artifact@main
        with:
          name: image-${{ inputs.name }}-arm64
          path: ./artifacts/arm64

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Load, Push and Create Manifests
        run: |
          IMAGE_NAME="${{ inputs.name }}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=${{ env.REGISTRY }}/$REPO_LOWER/$IMAGE_LOWER
          
          # Extract component version from Nix metadata
          VERSION=$(nix-instantiate --eval --raw ${{ inputs.file }} \
            -A "${{ inputs.attr }}.imageVersion" 2>/dev/null || echo "latest")
          DATE=$(date +'%Y.%-m.%-d')
          VERSION_TAG="${VERSION}-${DATE}"
          
          echo "Target Image: $IMAGE_ID"
          echo "Publishing version tag: $VERSION_TAG"

          # 1. Load, tag and push AMD64 image
          echo "Loading AMD64 image..."
          docker load -i ./artifacts/amd64/result-amd64
          docker tag $IMAGE_NAME:latest $IMAGE_ID:latest-amd64
          docker tag $IMAGE_NAME:latest $IMAGE_ID:${VERSION_TAG}-amd64
          docker push $IMAGE_ID:latest-amd64
          docker push $IMAGE_ID:${VERSION_TAG}-amd64
          docker rmi $IMAGE_NAME:latest

          # 2. Load, tag and push ARM64 image
          echo "Loading ARM64 image..."
          docker load -i ./artifacts/arm64/result-arm64
          docker tag $IMAGE_NAME:latest $IMAGE_ID:latest-arm64
          docker tag $IMAGE_NAME:latest $IMAGE_ID:${VERSION_TAG}-arm64
          docker push $IMAGE_ID:latest-arm64
          docker push $IMAGE_ID:${VERSION_TAG}-arm64
          docker rmi $IMAGE_NAME:latest

          # 3. Create and push Multi-Arch Manifest Lists
          echo "Creating and pushing Multi-Arch Manifests..."
          docker manifest rm $IMAGE_ID:latest 2>/dev/null || true
          docker manifest create $IMAGE_ID:latest \
            --amend $IMAGE_ID:latest-amd64 \
            --amend $IMAGE_ID:latest-arm64
          docker manifest push $IMAGE_ID:latest
          
          docker manifest rm $IMAGE_ID:${VERSION_TAG} 2>/dev/null || true
          docker manifest create $IMAGE_ID:${VERSION_TAG} \
            --amend $IMAGE_ID:${VERSION_TAG}-amd64 \
            --amend $IMAGE_ID:${VERSION_TAG}-arm64
          docker manifest push $IMAGE_ID:${VERSION_TAG}
