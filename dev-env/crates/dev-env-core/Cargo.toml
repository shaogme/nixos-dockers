[package]
name = "dev-env-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Runtime materializer for the dev-env environment DSL"
license = "MIT"

[dependencies]
dev-env-model = { path = "../dev-env-model" }
dev-env-provider = { path = "../dev-env-provider" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
dev-env-shell = { path = "../dev-env-shell" }
