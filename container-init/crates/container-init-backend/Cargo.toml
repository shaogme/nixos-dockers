[package]
name = "container-init-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Single-instance Unix socket backend and PID 1 supervisor for container-init"
license = "MIT"

[dependencies]
bootstrap-model = { path = "../bootstrap-model" }
container-init-core = { path = "../container-init-core" }
container-init-posix = { path = "../container-init-posix" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = { version = "3", default-features = false }
