[package]
name = "container-init-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "POSIX bootstrap action executor for container-init"
license = "MIT"

[dependencies]
bootstrap-model = { path = "../bootstrap-model" }
container-init-posix = { path = "../container-init-posix" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = { version = "3", default-features = false }
